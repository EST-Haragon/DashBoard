<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Consolidação de Relatórios</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background:#eef2f7;
    padding:20px;
}
h1{
    margin-bottom:5px;
}
button{
    padding:8px 14px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}
button:hover{
    background:#163a5c;
}
input{
    padding:6px;
    margin-top:5px;
}
#resultado{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    max-height:300px;
    overflow:auto;
}
#buscaResultado{
    margin-top:15px;
    background:#fff8dc;
    padding:10px;
    border-radius:6px;
}
canvas{
    margin-top:30px;
}
</style>
</head>
<body>

<h1>📊 Consolidador de Produção</h1>

<input type="file" id="pdfInput" multiple accept="application/pdf">
<br>
<button onclick="processarPDFs()">Processar PDFs</button>
<button onclick="gerarPDF()">Gerar PDF Consolidado</button>

<h3>🔎 Buscar NF no consolidado</h3>
<input type="text" id="nfBusca" placeholder="Digite o número da NF">
<button onclick="buscarNF()">Buscar</button>

<div id="buscaResultado"></div>

<div id="resultado"></div>

<canvas id="grafico"></canvas>

<script>
let dados = [];
let grafico;

async function processarPDFs(){
    dados = [];
    const files = document.getElementById("pdfInput").files;

    for(let file of files){
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;

        for(let i=1; i<=pdf.numPages; i++){
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const text = textContent.items.map(item => item.str).join(" ");
            extrairDados(text);
        }
    }

    mostrarResultado();
    gerarGrafico();
}

function extrairDados(texto){

    const loja = texto.match(/Loja:\s*(\w+)/)?.[1] || "N/A";
    const nfMatch = texto.match(/NF:\s*(\d+)/g);
    const colaboradorMatch = texto.match(/Colaborador:\s*(\w+)/g);
    const dataMatch = texto.match(/Data:\s*([\d\/:, ]+)/g);

    if(nfMatch){
        for(let i=0; i<nfMatch.length; i++){
            dados.push({
                loja: loja,
                nf: nfMatch[i].replace("NF: ",""),
                colaborador: colaboradorMatch ? colaboradorMatch[i].replace("Colaborador: ","") : "N/A",
                data: dataMatch ? dataMatch[i].replace("Data: ","") : "N/A"
            });
        }
    }
}

function mostrarResultado(){
    const div = document.getElementById("resultado");
    div.innerHTML = "<h3>📋 Dados Consolidados:</h3>";

    dados.forEach(d=>{
        div.innerHTML += `
        NF: ${d.nf} |
        Loja: ${d.loja} |
        Colaborador: ${d.colaborador} |
        Data: ${d.data} <br>`;
    });
}

function gerarGrafico(){

    let producao = {};

    dados.forEach(d=>{
        if(!producao[d.colaborador]) producao[d.colaborador] = 0;
        producao[d.colaborador]++;
    });

    const ctx = document.getElementById("grafico");

    if(grafico) grafico.destroy();

    grafico = new Chart(ctx,{
        type:'bar',
        data:{
            labels:Object.keys(producao),
            datasets:[{
                label:'Produção por Colaborador',
                data:Object.values(producao),
                borderWidth:1
            }]
        }
    });
}

function buscarNF(){
    const nf = document.getElementById("nfBusca").value.trim();
    const resultado = document.getElementById("buscaResultado");

    const encontrada = dados.find(d => d.nf === nf);

    if(encontrada){
        resultado.innerHTML = `
        ✅ NF Encontrada!<br>
        Loja: ${encontrada.loja}<br>
        Colaborador: ${encontrada.colaborador}<br>
        Data: ${encontrada.data}
        `;
    }else{
        resultado.innerHTML = "❌ NF não encontrada.";
    }
}

async function gerarPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let y = 10;
    doc.text("Relatório Consolidado de Produção",10,y);
    y+=10;

    dados.forEach(d=>{
        doc.text(`NF: ${d.nf}`,10,y); y+=6;
        doc.text(`Loja: ${d.loja}`,10,y); y+=6;
        doc.text(`Colaborador: ${d.colaborador}`,10,y); y+=6;
        doc.text(`Data: ${d.data}`,10,y); y+=10;

        if(y>270){
            doc.addPage();
            y=10;
        }
    });

    doc.save("Relatorio_Consolidado.pdf");
}
</script>

</body>
</html>
